[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hydrosense"
version = "0.3.0"
description = "Tag-driven hydro asset modelling from CSV/Excel and live PI data"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
  "joblib>=1.4,<2",
  "requests>=2.32,<3",
  "openpyxl>=3.1,<4",
  "torch>=2.3,<3",
  "lightning>=2.4,<3",
  "pytorch-forecasting>=1.4,<2",
]

[project.optional-dependencies]
pi = ["PIconnect>=0.12.4,<0.13; sys_platform == 'win32'"]
notebooks = ["nbformat>=5.10,<6", "ipykernel>=6.29,<8", "matplotlib>=3.8,<4"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["hydrosense*"]
