name: Windows executable
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Build bundled dashboard
        working-directory: webapp
        run: |
          npm ci
          npm run build:desktop
      - name: Install CPU runtime and packager
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . "pyinstaller>=6.16,<7" requests-negotiate-sspi
          python -m pip freeze > packaging-versions.txt
      - name: Test Python application
        run: python -m unittest discover -s tests -p test_hydrosense.py -v
      - name: Build single executable
        run: python -m PyInstaller --clean --noconfirm packaging/hydrosense.spec
      - name: Test actual executable
        run: python packaging/smoke_windows.py
      - name: Create checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/HydroSense.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  HydroSense.exe" | Set-Content -Encoding ascii dist/SHA256SUMS.txt
          Copy-Item packaging-versions.txt dist/packaging-versions.txt
      - name: Publish public download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "desktop-${GITHUB_RUN_NUMBER}" dist/HydroSense.exe dist/SHA256SUMS.txt dist/packaging-versions.txt --target "$GITHUB_SHA" --title "HydroSense for Windows" --notes-file packaging/RELEASE_NOTES.md --latest
      - name: Preserve build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-diagnostics
          path: |
            build/HydroSense/warn-HydroSense.txt
            packaging-versions.txt
